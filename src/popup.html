<!doctype html>
<html>
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="popup.css">
</head>
<body>
  <h1>🔊 Read Aloud</h1>
  <label for="voice">Voice</label>
  <select id="voice">
    <option value="af_heart">Heart (US, female)</option>
    <option value="af_bella">Bella (US, female)</option>
    <option value="af_nicole">Nicole (US, female, soft)</option>
    <option value="am_michael">Michael (US, male)</option>
    <option value="am_fenrir">Fenrir (US, male)</option>
    <option value="bf_emma">Emma (UK, female)</option>
    <option value="bm_george">George (UK, male)</option>
  </select>
  <label for="speed">Speed <span id="speedLabel">1.0×</span></label>
  <input id="speed" type="range" min="0.8" max="1.5" step="0.1" value="1">
  <div class="row">
    <button id="play" class="primary">▶ Read selection</button>
    <button id="stop">■</button>
  </div>
  <div id="status">Ready</div>
  <div class="hint" id="hint">Right-click selected text → Read aloud</div>
  <script src="popup.js"></script>
</body>
</html>
